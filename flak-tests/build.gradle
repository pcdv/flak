dependencies {
  implementation project(":flak-api")
  implementation project(":flak-spi")
  implementation project(":flak-jackson")
  implementation project(":flak-login")
  implementation project(":flak-resource")
  implementation project(":flak-backend-jdk")
  implementation project(":flak-backend-netty")
  implementation project(":flak-util")
  implementation project(":flak-swagger")
}

// the suite must pass against every backend: one Test task each, reports and
// results landing in build/{reports/tests,test-results}/<task name>
tasks.withType(Test).configureEach {
  // deliberately tight, and smaller than the bodies BigInputTest uploads: a
  // backend that buffers a request instead of streaming it fails here
  maxHeapSize = "256m"
  jvmArgs "-XX:MaxDirectMemorySize=64m"
}

test {
  systemProperty "backend", "jdk"
  // HttpServer reads up to 64KiB of the body a handler left unread, then
  // closes the connection, which may reset the client before it reads the
  // response: MaxBodySizeTest refuses bigger bodies than that without
  // reading them, and sometimes got "Connection reset" instead of a 413
  systemProperty "sun.net.httpserver.drainAmount", String.valueOf(1024 * 1024)
}

def testNetty = tasks.register("testNetty", Test) {
  description = "Runs the test suite against the netty backend."
  group = "verification"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  systemProperty "backend", "netty"
}

tasks.named("check") {
  dependsOn testNetty
}
