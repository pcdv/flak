def PUBLISH_PROJECTS = [
  'flak-api',
  'flak-spi',
  'flak-backend-jdk',
  'flak-backend-netty',
  'flak-jackson',
  'flak-login',
  'flak-resource',
  'flak-swagger',
  'flak-util',
  'flak-websocket'
]

allprojects {
  apply plugin: 'java'

  repositories {
    mavenCentral()
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  // -PtestJdk=21 runs the tests on another JDK than the one that compiles,
  // as CI does for each JDK supported: flak-websocket relies on internals of
  // the JDK, which a new release may break
  def testJdk = providers.gradleProperty('testJdk')
  if (testJdk.present) {
    tasks.withType(Test).configureEach {
      javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJdk.get())
      }
    }
  }

  dependencies {
    testImplementation "junit:junit:4.13.2"
  }

  if (PUBLISH_PROJECTS.contains(project.name)) {
    apply plugin: 'java-library'
    apply plugin: "ivy-publish"
    apply plugin: "maven-publish"

    java {
      withSourcesJar()
    }

    publishing {
      repositories {
        ivy {
          name = "local"
          url = "${System.properties['user.home']}/.ivy2/local"
        }
      }
      publications {
        // allows to do a local publish
        ivy(IvyPublication) {
          organisation = "com.github.pcdv.flak"
          from components.java
        }

        // publishToMavenLocal (or jitpack.io) using -Pversion=x.y.z
        maven(MavenPublication) {
          groupId = 'com.github.pcdv.flak'
          from components.java
        }
      }
    }
  }

  jar {
    manifest {
      attributes 'Implementation-Title': project.name,
        'Implementation-Version': project.version
    }
  }
}
