import javax.inject.Inject

dependencies {
  implementation project(':flak-api')
  runtimeOnly project(':flak-backend-jdk')
}

// consider app as resource so it is automatically included in jar and copied
// in classes dir (allows to run the server from the project dir)
sourceSets {
  main {
    resources {
      srcDir projectDir
      include 'app/**'
    }
  }
}

// zipTree() is only reachable through the script object, which a task cannot
// hold on to when the configuration cache is enabled: get the service injected
// instead, so the closure below captures it rather than the script
interface ArchiveOps {
  @Inject
  ArchiveOperations getArchiveOperations()
}

def archiveOps = objects.newInstance(ArchiveOps).archiveOperations

// make an executable jar
jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  // use the configuration's elements provider so that the tasks producing the
  // dependencies are properly declared as producers of this task's inputs
  from(configurations.runtimeClasspath.elements.map { entries ->
    // TODO: is there a way to include only required classes?
    entries.collect {
      it.asFile.isDirectory() ? it.asFile : archiveOps.zipTree(it.asFile)
    }
  })
  manifest { attributes 'Main-Class': 'samples.WebApp' }
}
