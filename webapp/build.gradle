dependencies {
  implementation project(':flak-api')
  implementation project(':flak-resource')
  runtimeOnly project(':flak-backend-jdk')
}

// consider app as resource so it is automatically included in jar and copied
// in classes dir (allows to run the server from the project dir)
sourceSets {
  main {
    resources {
      srcDir projectDir
      include 'app/**'
    }
  }
}

// make an executable jar
jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  // use the configuration's elements provider so that the tasks producing the
  // dependencies are properly declared as producers of this task's inputs
  from(configurations.runtimeClasspath.elements.map { entries ->
    // TODO: is there a way to include only required classes?
    entries.collect { it.asFile.isDirectory() ? it.asFile : zipTree(it.asFile) }
  })
  manifest { attributes 'Main-Class': 'samples.WebApp' }
}
